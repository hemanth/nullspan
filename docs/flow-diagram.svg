<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-label="Clairic System One Single-Pass Extraction Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#111111"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EBE8E0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Warm paper background -->
  <rect width="980" height="360" rx="10" fill="#FAF8F3" stroke="#111111" stroke-width="1.5"/>
  <rect x="6" y="6" width="968" height="348" rx="6" fill="url(#grid)"/>

  <!-- Header -->
  <text x="32" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#111111" letter-spacing="1.4">SYSTEM ONE EXTRACTION PIPELINE · SINGLE FORWARD PASS (ZERO OUTPUT TOKENS)</text>
  <line x1="32" y1="50" x2="948" y2="50" stroke="#111111" stroke-width="1.2"/>

  <!-- Left: Input State + Fields -->
  <rect x="32" y="76" width="210" height="248" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="32" y="76" width="210" height="28" rx="6" fill="#111111"/>
  <text x="46" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#FAF8F3">1. INPUT { state, fields }</text>

  <rect x="46" y="118" width="182" height="86" rx="4" fill="#F4F1EA" stroke="#111111" stroke-width="1.2"/>
  <text x="56" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">state (Unstructured Text)</text>
  <text x="56" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">"Claim A-88412 filed</text>
  <text x="56" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">May 3, 2026. Repair</text>
  <text x="56" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">$1,420 + $380 tow..."</text>

  <rect x="46" y="216" width="182" height="92" rx="4" fill="#F4F1EA" stroke="#111111" stroke-width="1.2"/>
  <text x="56" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">fields[] (Typed Queries)</text>
  <text x="56" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">• claim_id (text)</text>
  <text x="56" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">• total_claimed (number)</text>
  <text x="56" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">• adjustor_email (null?)</text>
  <text x="56" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">• price (estimate/grid)</text>

  <!-- Arrow 1 -->
  <line x1="242" y1="200" x2="288" y2="200" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="247" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#111111">Batch</text>

  <!-- Center: Shared Encoder -->
  <rect x="292" y="96" width="196" height="208" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <rect x="292" y="96" width="196" height="28" rx="6" fill="#111111"/>
  <text x="306" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#FAF8F3">2. SHARED ENCODER</text>

  <text x="308" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#111111">ClairicForExtraction</text>
  <text x="308" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#444444">67M DistilBERT Backbone</text>

  <rect x="308" y="176" width="164" height="54" rx="4" fill="#F4F1EA" stroke="#111111" stroke-width="1.2"/>
  <text x="318" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" fill="#111111">[CLS] type : name | desc</text>
  <text x="318" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#333333">[SEP] state tokens [SEP]</text>
  <text x="318" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#555555">offset_mapping preserved</text>

  <text x="308" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" fill="#111111">Complexity: O(1) passes</text>
  <text x="308" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">All fields evaluated in</text>
  <text x="308" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">one tensor batch on GPU</text>

  <!-- Fan-out arrows to 5 heads -->
  <line x1="488" y1="140" x2="540" y2="98" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="488" y1="170" x2="540" y2="149" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="488" y1="200" x2="540" y2="200" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="488" y1="230" x2="540" y2="251" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="488" y1="260" x2="540" y2="302" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- 5 Parallel Heads -->
  <rect x="544" y="76" width="184" height="42" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/>
  <text x="556" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">H1 · Abstention Head</text>
  <text x="556" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">p_null = σ(W_null · h_CLS)</text>

  <rect x="544" y="127" width="184" height="42" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/>
  <text x="556" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">H2 · Span Pointer Head</text>
  <text x="556" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">P(start, end) → char [s, e]</text>

  <rect x="544" y="178" width="184" height="42" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/>
  <text x="556" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">H3 · Multi-Span BIO Head</text>
  <text x="556" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">{O, B, I} → ordered list[]</text>

  <rect x="544" y="229" width="184" height="42" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/>
  <text x="556" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">H4 · Arithmetic Op Head</text>
  <text x="556" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">SPAN | SUM | DIFF | MUL | Δt</text>

  <rect x="544" y="280" width="184" height="44" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/>
  <text x="556" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#111111">H5 · Quantile Distribution</text>
  <text x="556" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#444444">[p10, p50, p90] + step grid</text>

  <!-- Merge arrows to Output -->
  <line x1="728" y1="200" x2="764" y2="200" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right: Typed Calibrated Output -->
  <rect x="768" y="76" width="180" height="248" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="768" y="76" width="180" height="28" rx="6" fill="#111111"/>
  <text x="782" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#FAF8F3">3. CALIBRATED JSON</text>

  <text x="780" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" fill="#111111">claim_id:</text>
  <text x="780" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#333333">val: "A-88412" [23,30]</text>
  <text x="780" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#333333">p_null: 0.001</text>

  <line x1="780" y1="160" x2="936" y2="160" stroke="#DDD8CE" stroke-width="1"/>

  <text x="780" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" fill="#111111">total_claimed:</text>
  <text x="780" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#333333">val: 1800 (1420+380)</text>

  <line x1="780" y1="200" x2="936" y2="200" stroke="#DDD8CE" stroke-width="1"/>

  <text x="780" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" fill="#111111">adjustor_email:</text>
  <text x="780" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#333333">val: null (p_null: 0.99)</text>

  <line x1="780" y1="240" x2="936" y2="240" stroke="#DDD8CE" stroke-width="1"/>

  <text x="780" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" fill="#111111">estimate / forecast:</text>
  <text x="780" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#333333">p10: 660k | med: 745k</text>
  <text x="780" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#333333">p90: 840k | PDF[61]</text>
  <text x="780" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" fill="#111111">Latency: ~0.9ms – 8.4ms</text>
</svg>
