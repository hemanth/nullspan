[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nullspan"
version = "1.1.0"
description = "Calibrated p_null abstention, grounded [start, end] span extraction, arithmetic, and distribution forecasting in a single forward pass."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Hemanth HM", email = "hemanth.hm@gmail.com" }
]
keywords = ["nullspan", "system-one", "extraction", "abstention", "p-null", "quantile-regression", "forecasting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.0.0", "transformers>=4.40.0", "safetensors>=0.4.0", "huggingface_hub>=0.23.0"]

[project.urls]
Homepage = "https://github.com/hemanth/nullspan"
Playground = "https://hemanth.github.io/nullspan/"
Model = "https://huggingface.co/gnumanth/nullspan"

[tool.flit.module]
name = "nullspan"
