[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "clairic-extract"
version = "0.1.0"
description = "System One structured extraction, computation, calibrated estimation, and time-series forecasting in a single pass."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Hemanth HM", email = "hemanth.hm@gmail.com" }
]
keywords = ["clairic", "system-one", "extraction", "ner", "quantile-regression", "forecasting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.0.0", "transformers>=4.40.0", "safetensors>=0.4.0", "huggingface_hub>=0.23.0"]

[project.urls]
Homepage = "https://github.com/hemanth/clairic-extract"
Playground = "https://hemanth.github.io/clairic-extract/"
Model = "https://huggingface.co/gnumanth/clairic-extract-v1"

[tool.flit.module]
name = "clairic_extract"
